---
services:
  dockerfmt:
    image: ghcr.io/reteps/dockerfmt:v0.5.4
    volumes:
      - .:/work:Z
    working_dir: /work

  hadolint:
    image: hadolint/hadolint:v2.14.0

  toolchain:
    build:
      context: .
    image: sbmufl-build:${SBMUFL_TOOLCHAIN_ARCH:-amd64}
    platform: linux/${SBMUFL_TOOLCHAIN_ARCH:-amd64}
    volumes:
      - .:/work:Z
